:root{--ink:#000;--paper:#fff;--mute:#4f4f4f;--logo:#1E2328;--sage:#CFDFCC;--ui:"Pix",ui-monospace,monospace;color-scheme:light}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overflow:clip}
body{background:#fff;color:#000;font:400 14px/18px var(--ui);
  user-select:none;-webkit-user-select:none;cursor:default}
*{font-variant-ligatures:none}
img,canvas,.pat{image-rendering:crisp-edges;image-rendering:pixelated}
b,.b{font-weight:600}
body.busy,body.busy *{cursor:wait!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Barre de menus (style commun à la gamme SOBRE) ---------- */
#menubar{position:fixed;left:0;top:0;right:0;height:24px;background:#fff;border-bottom:1px solid #000;z-index:10000;display:flex;align-items:stretch;padding:0 16px}
.mt{border:0;background:transparent;padding:0 10px;height:23px;font:400 14px/23px var(--ui);white-space:nowrap;display:flex;align-items:center;gap:6px;color:#000}
.mt.on{background:#000;color:#fff}
.mt.logo svg{width:22px;height:16px;display:block;image-rendering:pixelated}
.mt.logo.on svg{outline:1px solid #fff}
#desk{position:fixed;left:0;right:0;top:24px;bottom:0;background:var(--desk) 0 0/2px 2px;image-rendering:pixelated}
.menu{position:fixed;z-index:10030;background:#fff;border:1px solid #000;box-shadow:2px 2px 0 #000;min-width:230px;padding:2px 0;font:400 14px var(--ui)}
.mi{position:relative;display:flex;gap:24px;padding:3px 14px 3px 22px;line-height:17px;white-space:nowrap}
.mi .k{margin-left:auto;opacity:.85}
.mi.hl{background:#000;color:#fff}
.mi.hl img{filter:invert(1)}
.mi.dis{color:#8a8a8a}
.mi .ck{position:absolute;left:6px;top:7px}
.menu hr{border:0;border-top:1px dotted #000;margin:3px 0}

/* texte et contrôles inactifs : trame 50 % */
.dis,.btn:disabled,label.chk.dis{color:transparent!important;background-image:var(--p50)!important;background-size:2px 2px!important;
  -webkit-background-clip:text!important;background-clip:text!important}
.win.dimmed .dis,.win.dimmed .btn:disabled,.win.dimmed label.chk.dis{color:#000!important;background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important}

/* ---------- Fenêtres et palettes ---------- */
.win{position:absolute;background:#fff;border:1px solid #000;box-shadow:1px 1px 0 #000}
.tb{position:relative;height:19px;border-bottom:1px solid #000;display:flex;justify-content:center}
.tb::before{content:"";position:absolute;left:1px;right:1px;top:3px;height:11px;background:var(--stripes) 0 0/1px 2px;image-rendering:pixelated}
.tt{position:relative;background:#fff;padding:0 10px;font-weight:600;font-size:14px;line-height:18px;height:18px;white-space:nowrap;overflow:hidden;max-width:calc(100% - 60px);text-overflow:ellipsis}
.cb,.zb{position:absolute;top:3px;width:11px;height:11px;border:1px solid #000;background:#fff;box-shadow:0 0 0 2px #fff;z-index:1}
.cb{left:7px}
.zb{right:7px}
.zb::after{content:"";position:absolute;left:-1px;top:-1px;width:7px;height:7px;border:1px solid #000}
.cb.down{background:var(--burst) center/9px 9px no-repeat}
.zb.down{background:#000}
.wc{position:relative}
.win.shaded .wc{display:none}
.win.shaded .tb{border-bottom:0;height:18px}
.win.dimmed .wc::after{content:"";position:absolute;inset:0;background:var(--white50) 0 0/2px 2px;image-rendering:pixelated;z-index:5}
.outline{position:fixed;outline:1px dotted #000;z-index:10040;pointer-events:none}
.pbody{padding:8px 12px 14px}
.frow{display:flex;align-items:center;gap:8px;min-height:30px}
.frow .lab{width:84px}
.sizepal .frow{min-height:28px}
.sh{margin:10px 0 2px;border-bottom:1px dotted #000;padding-bottom:1px}
.qrow{display:flex;gap:6px;margin:4px 0 2px 92px}
.qrow .btn.sm{min-width:0;flex:1;padding:0 4px}
.qrow .btn.on{box-shadow:inset 0 0 0 1px #000;font-weight:600}
.scur{line-height:17px}
.crow{display:flex;gap:12px;margin-top:12px}
.crow .btn{flex:1}

/* boutons */
.btn{font:400 13px/20px var(--ui);height:24px;padding:0 12px;border:1px solid #000;border-radius:4px;background:#fff;color:#000;
  cursor:default;outline:none;white-space:nowrap}
.btn:active:not(:disabled),.btn.down{background:#000;color:#fff}
.btn.def{box-shadow:0 0 0 1px #fff,0 0 0 4px #000;border-radius:6px}
.btn:focus-visible{outline:1px dotted #000;outline-offset:-4px}
.btn.sm{padding:0 8px;height:20px;line-height:18px;font-size:12px}

/* cases et boutons radio */
label.chk{display:inline-flex;align-items:center;gap:7px;height:20px;white-space:nowrap}
label.chk input{position:absolute;opacity:0;width:0;height:0}
label.chk .box{width:12px;height:12px;flex:none;background:var(--chk0) 0 0/12px 12px;image-rendering:pixelated}
label.chk input:checked+.box{background-image:var(--chk1)}
label.chk.radio .box{background-image:var(--rad0)}
label.chk.radio input:checked+.box{background-image:var(--rad1)}
label.chk input:focus-visible+.box{outline:1px dotted #000;outline-offset:2px}
.rgrid{display:grid;grid-template-columns:120px 1fr;grid-auto-rows:22px;margin:4px 0 0 4px}

/* champs */
input.fld,textarea.fld{font:400 13px/18px var(--ui);border:1px solid #000;padding:0 6px;outline:none;background:#fff;color:#000;border-radius:0;
  user-select:text;-webkit-user-select:text;cursor:text}
input.fld{height:22px}
textarea.fld{display:block;width:100%;resize:none;padding:3px 6px;font-size:14px}
::selection{background:#000;color:#fff}

/* palette Outils */
.tgrid{display:grid;grid-template-columns:repeat(2,32px);grid-auto-rows:32px;padding:5px 6px 7px 5px}
.tool{width:33px;height:33px;border:1px solid #000;background:#fff;padding:0;display:flex;align-items:center;justify-content:center;outline:none}
.tool img{width:20px;height:20px}
.tool:active:not(:disabled),.tool.on{background:#000}
.tool:active:not(:disabled) img,.tool.on img{filter:invert(1)}
.tip{position:fixed;background:#fff;border:1px solid #000;border-radius:6px;padding:3px 10px;font-size:13px;z-index:10050;pointer-events:none;white-space:nowrap}

/* curseurs de réglage */
.sl{position:relative;height:36px;margin:0 10px 2px}
.slh{display:flex;justify-content:space-between;height:20px;padding:0 2px}
.slt{position:absolute;left:0;right:0;top:16px;height:20px;touch-action:none}
.slt .end{position:absolute;top:6px;width:7px;height:7px}
.slt .end.l{left:2px}.slt .end.r{right:2px}
.track{position:absolute;left:14px;right:14px;top:9px;height:1px;background:#000}
.tick{position:absolute;bottom:0;width:1px;background:#000}
.thumb{position:absolute;top:1px;width:11px;height:7px}

/* palette Texte */
.sw{display:flex;gap:6px;margin:4px 0 2px}
.swb{width:20px;height:20px;border:1px solid #000;padding:0;outline:none}
.swb.on{box-shadow:0 0 0 1px #fff,0 0 0 3px #000}
.hint{margin-top:8px;font-size:13px;line-height:16px}

/* ---------- Document ---------- */
.doc .wc{position:absolute;left:0;right:0;top:19px;bottom:0}
.rcorner{position:absolute;left:0;top:0;width:14px;height:14px;border-right:1px solid #000;border-bottom:1px solid #000}
.rtop{position:absolute;left:14px;right:0;top:0;height:14px;border-bottom:1px solid #000}
.rleft{position:absolute;left:0;top:14px;width:14px;bottom:20px;border-right:1px solid #000}
.rtop canvas,.rleft canvas{position:absolute;left:0;top:0}
.area{position:absolute;left:14px;right:0;top:14px;bottom:20px;overflow:hidden;background:var(--dots) 0 0/4px 2px;image-rendering:pixelated}
.pv{position:absolute;box-shadow:0 0 0 1px #000}
.txc{position:absolute;pointer-events:none}
.bar{position:absolute;left:0;right:0;bottom:0;height:20px;border-top:1px solid #000;padding:0 28px 0 8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:19px}
.grow{position:absolute;right:0;bottom:0;width:20px;height:20px;border-left:1px solid #000;border-top:1px solid #000;display:flex;align-items:center;justify-content:center}
.grow img{width:14px;height:14px}
.ov{position:absolute;pointer-events:none}
.ov .dim{position:absolute;background:var(--p50) 0 0/2px 2px;image-rendering:pixelated}
.ov svg{position:absolute;overflow:visible}
.ov .third{position:absolute;border:0 dashed rgba(255,255,255,.85)}
.ov .hd{position:absolute;width:7px;height:7px;background:#000;border:1px solid #fff}
@keyframes ants{to{stroke-dashoffset:-8}}
.ants{animation:ants .9s steps(8) infinite}

/* ---------- Dialogues (style commun à la gamme SOBRE) ---------- */
.ovl{position:fixed;inset:0;z-index:10010;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(255,255,255,.35)}
.dlg{background:#fff;border:2px solid #000;box-shadow:3px 3px 0 #000;outline:1px solid #000;outline-offset:-6px;padding:16px 18px;max-width:100%;max-height:100%;overflow:auto;
  display:flex;flex-direction:column;gap:12px}
.dlg p{margin:0;line-height:1.45}
.dlg-row{display:flex;gap:12px;align-items:flex-start}
.dlg-ico{flex:none;width:36px;height:36px;border:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600}
.dlg-btns{display:flex;justify-content:flex-end;gap:16px;flex-wrap:wrap;border-top:1px solid #000;padding-top:14px;margin-top:2px}
.dlg-btns .left{margin-right:auto}
.about{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:6px 10px}
.about img{width:260px;height:auto;image-rendering:auto}
.about .copy{font-size:12px;color:var(--mute)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:2px 18px;font-size:14px}
.keys span:nth-child(odd){font-weight:600;white-space:nowrap}


/* fenêtre Tramer */
.trame{display:flex;gap:20px;align-items:flex-start}
.tprev{display:flex;flex-direction:column;gap:6px;width:422px;flex:none}
.tprev canvas{width:420px;height:300px;border:1px solid #000;background:var(--dots) 0 0/4px 2px;image-rendering:auto}
.tprev canvas.detail{cursor:grab}
.tctl{width:250px;display:flex;flex-direction:column}
.tctl .sl{margin:0 0 4px}
.trow{display:flex;gap:18px}
.inks{display:flex;gap:8px;margin:6px 0 2px}
.ink{width:28px;height:20px;border:1px solid #000;padding:0;outline:none}
.ink.on{box-shadow:0 0 0 1px #fff,0 0 0 3px #000}
.loupe{position:fixed;width:204px;height:204px;border:2px solid #000;box-shadow:3px 3px 0 #000;background:#fff;z-index:9000;pointer-events:none}
.loupe canvas{width:200px;height:200px;display:block;image-rendering:pixelated}
/* ---------- Page d'accueil et écran de fermeture ---------- */
#splash,.quit{position:fixed;inset:0;z-index:20000;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px 16px;transition:opacity .25s ease}
#splash{cursor:pointer}
#splash.out{opacity:0}
.sp-logo{width:min(480px,78vw);height:auto;display:block;image-rendering:auto}
.sp-bar{width:min(340px,70vw);height:14px;border:1px solid var(--logo);padding:2px;background:#fff}
.sp-fill{height:100%;width:0;background:var(--logo);animation:spfill 5s steps(24,end) forwards}
@keyframes spfill{to{width:100%}}
.sp-go{border:0;background:transparent;font:400 13px var(--ui);color:var(--mute);cursor:pointer;padding:4px 8px}
.sp-go:hover,.sp-go:focus-visible{color:#000;text-decoration:underline;outline:none}
.sp-copy{margin:0;font:400 12px var(--ui);color:var(--mute);letter-spacing:.04em}
.q-msg{margin:0;font:400 15px var(--ui)}
body.dragover #desk{background:#000}
</style>
</head>

// ------------------------------------------------------- palette Taille --
// Deux façons de voir la même image : en pixels (écran) et en centimètres (impression).
// Le lien entre les deux est la résolution : cm = px ÷ ppp × 2,54.
// Changer la résolution ne touche pas aux pixels : seule la taille d'impression change.
const sizePal = new Win({title: "Taille", cls: "pal sizepal"});
sizePal.w = 260;

(function buildSize() {
  const b = el("div", "pbody");
  SCUR = el("div", "scur", "Actuelle : —"); b.appendChild(SCUR);
  const mk = (lab, unit, mode, w = 96) => {
    const r = el("div", "frow"); r.innerHTML = `<span class="lab">${lab}</span>`;
    const f = el("input", "fld"); f.style.width = w + "px"; f.inputMode = mode;
    f.addEventListener("beforeinput", e => { if (e.data && /[^0-9.,]/.test(e.data)) e.preventDefault(); });
    r.append(f, document.createTextNode(unit)); b.appendChild(r); return f;
  };
  b.appendChild(el("div", "b sh", "Écran (pixels)"));
  SW = mk("Largeur", "px", "numeric"); SH = mk("Hauteur", "px", "numeric"); SP = mk("Échelle", "%", "decimal");
  const q = el("div", "qrow");
  for (const pc of [25, 50, 75]) q.appendChild(btn(pc + " %", "sm", () => { SP.value = pc; SP.dispatchEvent(new Event("input")); }));
  b.appendChild(q);
  b.appendChild(el("div", "b sh", "Impression"));
  CW = mk("Largeur", "cm", "decimal"); CH = mk("Hauteur", "cm", "decimal"); SD = mk("Résolution", "ppp", "numeric");
  SD.title = "points par pouce (dpi)";
  const d = el("div", "qrow");
  for (const v of DPI_PRESETS) { const x = btn(String(v), "sm", () => { SD.value = v; SD.dispatchEvent(new Event("input")); }); x.dataset.dpi = v; d.appendChild(x); }
  b.appendChild(d);
  let l; [l, SLOCK] = chk("Conserver les proportions", false); SLOCK.checked = true; l.style.marginTop = "6px"; b.appendChild(l);
  SINFO = el("div", "hint"); SINFO.style.minHeight = "32px"; b.appendChild(SINFO);
  const row = el("div", "crow");
  const ap = btn("Appliquer", "def", () => applySize()); ap.id = "sapply";
  row.appendChild(ap); b.appendChild(row);
  sizePal.body.appendChild(b);
  const ow = () => S.base ? S.base.width : 1, oh = () => S.base ? S.base.height : 1;
  // chaque champ fixe une valeur, les autres suivent
  const on = (f, fn) => f.addEventListener("input", () => { const v = numOf(f); Z.ok = v !== null; if (v !== null) fn(v); fillSize(f); });
  on(SW, v => { Z.w = Math.round(v); if (SLOCK.checked) Z.h = Math.max(1, Math.round(v * oh() / ow())); });
  on(SH, v => { Z.h = Math.round(v); if (SLOCK.checked) Z.w = Math.max(1, Math.round(v * ow() / oh())); });
  on(SP, v => { Z.w = Math.max(1, Math.round(ow() * v / 100)); Z.h = Math.max(1, Math.round(oh() * v / 100)); });
  on(CW, v => { Z.w = toPx(v, Z.dpi); if (SLOCK.checked) Z.h = Math.max(1, Math.round(Z.w * oh() / ow())); });
  on(CH, v => { Z.h = toPx(v, Z.dpi); if (SLOCK.checked) Z.w = Math.max(1, Math.round(Z.h * ow() / oh())); });
  on(SD, v => { Z.dpi = Math.min(9600, v); });

  const samePx = t[0] === S.base.width && t[1] === S.base.height, sameDpi = Z.dpi === S.dpi;

}
function focusSize() { if (!S.base) return; sizePal.open(); SW.focus(); SW.select(); }

      MI("Dessin", () => toolDraw("free"), "D", h, S.drawMode),
      MI("Taille de l'image…", focusSize, "", h), MI("Trame…", () => openTrame(), "", h), null,
      MI("Pivoter à gauche", () => transform("rotl", "Rotation"), "", h), MI("Pivoter à droite", () => transform("rotr", "Rotation"), "", h),
      MI("Miroir horizontal", () => transform("fliph", "Miroir"), "", h), MI("Miroir vertical", () => transform("flipv", "Miroir"), "", h)]],
    ["Affichage", () => [MI("Aperçu de la trame", toggleTrame, "", h, S.trameOn), MI("Loupe 100 %", () => setLoupe(!T.loupe), "", h, T.loupe)]],
    ["Fenêtre", () => [MI("Outils", () => togglePal(tools), "", true, tools.shown), null,
      ...RIGHT.map(p => MI(p.tt.textContent, () => togglePal(p), "", true, p.shown)), null,
      MI("Replier les palettes", () => shadeAll(true), "", RIGHT.some(p => p.shown && !p.collapsed)), null,
      MI("Réinitialiser la disposition", resetLayout)]],
    ["Aide", () => [MI("Raccourcis clavier…", cmdKeys), null, MI("À propos de SOBRE-PiX…", cmdAbout)]],
  ];
}
function togglePal(p) { p.shown ? p.hide() : p.show(); savePrefs(); layout(); }
function shadeAll(v) { for (const p of RIGHT) p.setCollapsed(v); savePrefs(); layout(); }
function resetLayout() { for (const p of PALS) p.show(); tools.setCollapsed(false); for (const p of RIGHT) p.setCollapsed(true); savePrefs(); layout(true); }
const MT = [];
menuDefs().forEach(([label], i) => {
  const t = el("button", "mt" + (label ? "" : " logo")); t.type = "button"; t.tabIndex = -1;
  if (label) t.textContent = label; else { t.innerHTML = LOGO_SVG; t.setAttribute("aria-label", "SOBRE-PiX"); }
  t.dataset.i = i; MENUBAR.appendChild(t); MT.push(t);
});
let menuIdx = null, menuEl = null, menuOpenT = 0;
function openMenu(i) {
  closeMenu();
  menuIdx = i; MT[i].classList.add("on");
  const m = menuEl = el("div", "menu"); m.setAttribute("role", "menu");
  for (const it of menuDefs()[i][1]()) {
    if (!it) { m.appendChild(el("hr")); continue; }
    const r = el("div", "mi" + (it.en ? "" : " dis")); r.setAttribute("role", "menuitem");
    r.innerHTML = `<span>${esc(it.label)}</span>` + (it.k ? `<span class="k">${esc(it.k)}</span>` : "");
    if (it.ck) r.prepend(icon("check", "ck"));
    r._it = it; m.appendChild(r);
  }
  document.body.appendChild(m);
  const rr = MT[i].getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(rr.left, innerWidth - m.offsetWidth - 8)) + "px"; m.style.top = rr.bottom + "px";
  menuOpenT = Date.now();
}
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } if (menuIdx !== null) MT[menuIdx].classList.remove("on"); menuIdx = null; }
function itemAt(x, y) { const e = document.elementFromPoint(x, y); const r = e && e.closest && e.closest(".mi"); return r && menuEl && menuEl.contains(r) ? r : null; }
function titleAt(x, y) { const e = document.elementFromPoint(x, y); const t = e && e.closest && e.closest(".mt"); return t ? +t.dataset.i : null; }
function setHl(r) { if (!menuEl) return; for (const x of menuEl.querySelectorAll(".mi.hl")) if (x !== r) x.classList.remove("hl"); if (r && r._it.en) r.classList.add("hl"); }
function runItem(r) { if (!r || !r._it.en) return; const cb = r._it.cb; closeMenu(); cb(); }
addEventListener("pointerdown", e => {
  if (e.button !== 0 || !SPLASH.hidden || !QUIT.hidden) return;
  const ti = titleAt(e.clientX, e.clientY);
  if (menuEl) {
    if (menuEl.contains(e.target)) { e.preventDefault(); return; }
    if (ti !== null && ti !== menuIdx) { e.preventDefault(); openMenu(ti); return; }
    e.preventDefault(); e.stopPropagation(); closeMenu(); return;
  }
  if (ti !== null && !modalOpen()) { e.preventDefault(); openMenu(ti); }
}, true);
addEventListener("pointermove", e => {
  if (!menuEl) return;
  const ti = titleAt(e.clientX, e.clientY);
  if (ti !== null && ti !== menuIdx) { openMenu(ti); return; }
  const r = itemAt(e.clientX, e.clientY); if (r) setHl(r);
}, true);
addEventListener("pointerup", e => {
  if (!menuEl) return;
  const r = itemAt(e.clientX, e.clientY);
  if (r) { runItem(r); return; }
  if (titleAt(e.clientX, e.clientY) !== null) return;
  if (menuEl.contains(document.elementFromPoint(e.clientX, e.clientY))) return;
  if (Date.now() - menuOpenT > 400) closeMenu();
}, true);
function menuKey(e) {
  const items = [...menuEl.querySelectorAll(".mi:not(.dis)")], cur = menuEl.querySelector(".mi.hl"), i = items.indexOf(cur);
  if (e.key === "Escape") closeMenu();
  else if (e.key === "ArrowDown") setHl(items[(i + 1) % items.length]);
  else if (e.key === "ArrowUp") setHl(items[(i - 1 + items.length) % items.length]);
  else if (e.key === "ArrowRight" || e.key === "ArrowLeft") { const n = MT.length; openMenu((menuIdx + (e.key === "ArrowRight" ? 1 : -1) + n) % n); setHl(menuEl.querySelector(".mi:not(.dis)")); }
  else if (e.key === "Enter" || e.key === " ") runItem(cur);
  else return;
  e.preventDefault();
}

// ------------------------------------------------------------- clavier --
addEventListener("keydown", e => {
  if (!SPLASH.hidden || !QUIT.hidden) return;
  if (menuEl) { menuKey(e); return; }
  if (modalOpen()) {
    const d = dialogs[dialogs.length - 1], tag = (e.target.tagName || "");
    if (e.key === "Escape") { e.preventDefault(); if (d.cancel) d.cancel.click(); else d.close(); }
    else if (e.key === "Enter" && d.def && !/TEXTAREA|BUTTON/.test(tag)) { e.preventDefault(); flashThen(d.def); }
    return;
  }
  const ae = document.activeElement, ctrl = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  const typing = ae && ae.matches && ae.matches("input.fld, textarea");
  if (typing) {
    if (ae === TA) {
      if (e.key === "Escape") { e.preventDefault(); cancelText(); return; }
      if (e.key === "Enter" && ctrl) { e.preventDefault(); poseText(); return; }
    }
    if (sizePal.el.contains(ae) && e.key === "Enter") { e.preventDefault(); applySize(); return; }
    if (e.key === "Escape") { ae.blur(); return; }
    if (!(ctrl && (k === "o" || k === "s"))) return;     // annuler/copier/coller restent ceux du champ
  }
  if (ctrl) {
    if (k === "o") { e.preventDefault(); cmdOpen(); }
    else if (k === "s") { e.preventDefault(); cmdSave(); }
    else if (k === "z") { e.preventDefault(); e.shiftKey ? cmdRedo() : cmdUndo(); }
    else if (k === "y") { e.preventDefault(); cmdRedo(); }
    return;
  }
  if (e.altKey) return;
  if (e.key === "Enter") { if (S.crop) { e.preventDefault(); applyCrop(); } }
  else if (e.key === "Escape") { cancelCrop(); cancelText(); stopDraw(); }
  else if (k === "c") toggleCrop();
  else if (k === "t") { e.preventDefault(); toggleText(); }
  else if (k === "d") toolDraw("free");
  else if ((e.key === "[" || e.key === "]") && S.drawMode) {
    const v = S.draw.size, st = Math.max(1, Math.round(v * 0.15));
    S.draw.size = clamp(v + (e.key === "]" ? st : -st), 1, 120); drawChanged();
  }
});

// --------------------------------------------------------- mise en page --
let placed = false;
const LEFT = [tools], RIGHT = [trPal, textPal, sizePal, adjust, drawPal, cropPal], PALS = [...LEFT, ...RIGHT];
const GAP = 6;
/** Hauteur d'une palette repliée (sa barre de titre seule). */
function shadeH() { const p = RIGHT.find(p => p.shown && p.collapsed); return p ? p.height : 20; }
/** Chaque palette de droite a une place fixe dans la colonne, celle qu'elle occupe repliée :
    en se dépliant, elle passe par-dessus les autres sans les décaler. */
function stack() {
  const W = innerWidth, H = innerHeight, top = MB + 12, sh = shadeH();
  let y = top;
  for (const p of LEFT) { if (!p.shown || p.userMoved) continue; p.x = 12; p.y = y; p.place(); y += p.height + 14; }
  y = top;
  for (const p of RIGHT) {
    if (!p.shown || p.userMoved) continue;
    p.x = W - 14 - p.w;
    p.y = p.collapsed ? y : Math.max(top, Math.min(y, H - 10 - p.height));   // dépliée, elle remonte si elle sortirait de l'écran
    p.place(); y += sh + GAP;
  }
  for (const p of PALS) if (!p.userMoved) p.rememberAnchor();
}
function layout(reset) {
  const W = innerWidth, H = innerHeight;
  if (reset || !placed) { for (const p of PALS) p.userMoved = false; placed = true; doc.auto = true; }
  for (const p of PALS) if (p.userMoved && p.anchorRight) p.x = W - p.rightOff;
  stack();
  for (const p of PALS) { [p.x, p.y] = clampPos(p.x, p.y, p.w); p.place(); }
  const lefts = PALS.filter(p => p.shown && !p.anchorRight).map(p => p.x + p.width);
  const rights = PALS.filter(p => p.shown && p.anchorRight).map(p => p.x);
  const left = lefts.length ? Math.max(...lefts) + 14 : 12, right = rights.length ? Math.min(...rights) - 14 : W - 12;
  const top = MB + 12, bottom = H - 14;
  if (doc.auto) { doc.x = left; doc.y = top; doc.w = Math.max(doc.minW, right - left); doc.h = Math.max(doc.minH, bottom - top); }
  else [doc.x, doc.y] = clampPos(doc.x, doc.y, doc.w);
  if (doc.shown) relayoutDoc();
  welcome.place();
  welcome.x = Math.max(left, left + Math.round((right - left - welcome.width) / 2));
  welcome.y = Math.max(top, top + Math.round((bottom - top - welcome.height) / 3));
  welcome.place();
  placeThumbs();
  for (const sl of TSLIDERS) sl.update();
}
addEventListener("scroll", () => { if (scrollX || scrollY) scrollTo(0, 0); });
// si une palette dépliée change de hauteur, on vérifie qu'elle tient dans l'écran
if (window.ResizeObserver) {
  let roQ = false;
  const ro = new ResizeObserver(() => { if (!roQ && placed) { roQ = true; requestAnimationFrame(() => { roQ = false; layout(); }); } });
  for (const p of PALS) ro.observe(p.el);
}
let rzT = null;
addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => layout(), 60); });

// --------------------------------------------------- état de l'interface
function refreshUI() {
  const has = !!S.base;
  document.title = has ? `${S.name} — SOBRE-PiX` : "SOBRE-PiX";
  for (const [name] of TOOLDEFS) {
    const b = TOOLBTN[name], en = has && (name !== "undo" || S.undo.length > 0 || !!S.crop || S.textMode);
    b.disabled = !en; b.firstChild.src = en ? ICON_URL[name] : iconDis(name);
  }
  TOOLBTN.crop.classList.toggle("on", !!S.crop);
  TOOLBTN.text.classList.toggle("on", S.textMode);
  TOOLBTN.eye.classList.toggle("on", S.compare);
  TOOLBTN.onebit.classList.toggle("on", S.trameOn);
  refreshTrame();
  TOOLBTN.pencil.classList.toggle("on", S.drawMode && S.draw.shape === "free");
  TOOLBTN.shapes.classList.toggle("on", S.drawMode && S.draw.shape !== "free");
  for (const p of RIGHT) p.el.classList.toggle("dimmed", !has);
  $("#reset").disabled = !(has && anyAdj(S.adj));
  for (const [key] of RATIOS) RADIO[key].checked = S.ratio === key;
  const vEn = has && S.ratio !== "free" && S.ratio !== "1:1";
  portraitInput.checked = S.portrait; portraitInput.disabled = !vEn; portraitLabel.classList.toggle("dis", !vEn);
  $("#cstart").style.display = S.crop ? "none" : ""; $("#cstart").disabled = !has;
  $("#ccancel").style.display = $("#capply").style.display = S.crop ? "" : "none";
  syncSize();
  refreshTextPal();
  refreshDrawPal();
  placeThumbs();
  if (has) refreshDocText();
}

// ---------------------------------------------------------- démarrage ---
for (const p of PALS) p.show();
// au démarrage, toutes les palettes de droite sont repliées, rangées dans l'ordre de RIGHT
for (const p of RIGHT) p.setCollapsed(true);
layout(true);
const hid = PREFS.hidden || {};
if (hid.tools) tools.hide(); if (hid.text) textPal.hide(); if (hid.adjust) adjust.hide(); if (hid.crop) cropPal.hide(); if (hid.size) sizePal.hide(); if (hid.trame) trPal.hide(); if (hid.draw) drawPal.hide();
welcome.show();
layout(true);
refreshUI();
if (document.fonts && document.fonts.load) Promise.all([document.fonts.load("400 16px Pix"), document.fonts.load("600 16px Pix")]).then(() => { layout(); drawDraft(); }).catch(() => {});

/* Page d'accueil : 5 secondes, ou un clic, ou une touche */
$(".sp-ver", SPLASH).textContent = VERSION;
function closeSplash() {
  if (SPLASH.dataset.closing) return;
  SPLASH.dataset.closing = "1";
  document.removeEventListener("keydown", splashKey, true);
  SPLASH.classList.add("out");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  setTimeout(() => { SPLASH.hidden = true; layout(); }, reduce ? 0 : 260);
}
function splashKey(e) { if (["Shift", "Control", "Alt", "Meta"].includes(e.key)) return; e.preventDefault(); e.stopPropagation(); closeSplash(); }
SPLASH.addEventListener("click", closeSplash);
document.addEventListener("keydown", splashKey, true);
$(".sp-fill", SPLASH).addEventListener("animationend", closeSplash);
setTimeout(closeSplash, 5300);     // filet de sécurité (animations désactivées, onglet en arrière-plan…)
</script>
</body>
